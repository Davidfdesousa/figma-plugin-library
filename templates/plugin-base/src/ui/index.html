<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plugin Factory Template</title>
    <style>
      /* PF_TOKENS_CSS */
      body {
        margin: 0;
      }
    </style>
  </head>
  <body class="pf-container">
    <div id="restricted" hidden>
      <pf-card>
        <p>You don't have access to this plugin. Contact the design system foundation team.</p>
      </pf-card>
    </div>
    <div id="app" hidden class="pf-stack">
      <pf-card>
        <h1 slot="header">Plugin Factory Template</h1>
        <div class="pf-stack">
          <p>Selected nodes: <span id="selection-count">0</span></p>
          <pf-field id="name-field" label="Your name" placeholder="Ada"></pf-field>
          <p id="echo"></p>
        </div>
        <div slot="footer">
          <pf-button id="submit" variant="primary">Say hello</pf-button>
        </div>
      </pf-card>
    </div>
    <script>
      /* PF_UI_SCRIPT */
    </script>
  </body>
</html>
